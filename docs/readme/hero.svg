<text x="64" y="190" font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="#FF5B1F">PREDICT · DIAGNOSE · DECIDE</text>
<text font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#F2F4F7"><tspan x="62" y="250">Hears a machine failing</tspan><tspan x="62" y="292">before it breaks.</tspan></text>
<text font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8"><tspan x="64" y="332">Detects drift early, diagnoses it on AMD with checked</tspan><tspan x="64" y="355">evidence, alerts the right technician, and weighs</tspan><tspan x="64" y="378">repair against replace.</tspan></text>
