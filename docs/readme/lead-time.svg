<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Median warning before failure per fault type. Bearing wear: legacy alarm 4.1 h, Operion 41.7 h. Cavitation: 7.2 h vs 19.8 h. Misalignment: 9.6 h vs 63.8 h. Motor overheating: 5.7 h vs 30.5 h. All faults: 6.2 h vs 36.4 h.">
<title>Warning before failure: legacy alarm vs Operion</title>
<defs><style>
