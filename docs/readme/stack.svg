<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="The tech stack drawn as a process and instrumentation diagram: a Python and NumPy simulator feeds a NumPy detector into a FastAPI controller, which serves a React control room, reads a knowledge silo searched with rank-bm25, and sends every LLM call to the AMD Radeon API running DeepSeek-V4-Flash. Answers return through an evidence check. Telegram is an optional alarm horn. pytest and the eval harness form the test bench.">
<title>Operion stack as a P&amp;ID</title>
<defs>
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity=".08"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#A9D1F5"/></marker>
  <style>
    .t { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .eq { fill: #0E2740; stroke: #A9D1F5; stroke-width: 2; }
    .pipe { fill: none; stroke: #A9D1F5; stroke-width: 3; }
    .sigl { fill: none; stroke: #A9D1F5; stroke-width: 1.5; stroke-dasharray: 8 4 2 4; }
    .tag { font-size: 11.5px; fill: #7FB2E5; }
    .nm { font-size: 13px; font-weight: 700; fill: #F2F4F7; letter-spacing: .5px; }
    .tx { font-size: 12.5px; fill: #C7DDF2; }
    .bub { fill: #0B1F33; stroke: #A9D1F5; stroke-width: 1.6; }
    .bt { font-size: 12px; font-weight: 700; fill: #F2F4F7; }
    .bv { font-size: 10px; fill: #FDBA74; }
    .flow { fill: none; stroke: #FF5B1F; stroke-width: 3; stroke-dasharray: 3 21; animation: fl 1.4s linear infinite; }
    @keyframes fl { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
</defs>
<rect width="1280" height="620" rx="20" fill="#0B1F33"/>
<rect width="1280" height="620" rx="20" fill="url(#g)"/>
<rect width="1280" height="620" rx="20" fill="url(#G)"/>

<!-- skid / battery limit -->
<rect x="36" y="24" width="654" height="524" rx="6" fill="none" stroke="#A9D1F5" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="14 6"/>
<text x="52" y="48" class="m nm" style="font-size:12px">SKID-01 · ONE DOCKER IMAGE</text>
<text x="52" y="66" class="t tx" style="font-size:11.5px">node:20 builds the UI → python:3.11-slim</text>
<text x="52" y="82" class="t tx" style="font-size:11.5px">Hugging Face Spaces · port 7860</text>
<text x="698" y="540" class="m tag" transform="rotate(-90 698 540)">BATTERY LIMIT · OFF-SKID →</text>

<!-- TK-101 simulator -->
<path class="eq" d="M70 210A50 40 0 0 1 170 210V300A50 40 0 0 1 70 300Z"/>
<path d="M70 230H170M70 280H170" stroke="#A9D1F5" stroke-opacity=".35"/>
<text x="120" y="262" text-anchor="middle" class="m tag">4 × 7</text>
<text x="120" y="360" text-anchor="middle" class="m tag">TK-101</text>
<text x="120" y="378" text-anchor="middle" class="t nm">SIMULATOR</text>
<text x="120" y="396" text-anchor="middle" class="t tx">Python 3.11 · NumPy</text>
<text x="120" y="413" text-anchor="middle" class="t tx">PyYAML plant config</text>

<!-- P1 + FT -->
<path class="pipe" d="M170 250H262" marker-mid="url(#ar)"/>
<path class="flow" d="M170 250H262"/>
<line x1="216" y1="222" x2="216" y2="250" stroke="#A9D1F5" stroke-width="1.2"/>
<circle cx="216" cy="200" r="22" class="bub"/><line x1="194" y1="200" x2="238" y2="200" stroke="#A9D1F5" stroke-width="1"/>
<text x="216" y="195" text-anchor="middle" class="t bt">FT</text><text x="216" y="213" text-anchor="middle" class="t bv">5 min</text>

