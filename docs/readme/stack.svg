<path class="pipe" d="M770 276H590"/>
<path class="flow" d="M770 276H590"/>
<path class="eq" d="M664 262V290L636 276Z"/><line x1="632" y1="262" x2="632" y2="290" stroke="#A9D1F5" stroke-width="3"/>
