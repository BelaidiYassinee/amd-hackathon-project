<g fill="#22C55E"><circle cx="436" cy="210" r="3"/><circle cx="447" cy="210" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle></g>
<circle cx="458" cy="210" r="3" fill="#FF5B1F"/>
<text x="505" y="232" text-anchor="middle" class="m tag">PLC-301</text>
<text x="505" y="251" text-anchor="middle" class="t nm">CONTROLLER</text>
<text x="505" y="270" text-anchor="middle" class="t tx">FastAPI · Uvicorn</text>
