<path d="M495 144V154M470 158H540" stroke="#A9D1F5" stroke-width="3"/>
<text x="505" y="72" text-anchor="middle" class="t nm">HMI-401 · CONTROL ROOM</text>
<text x="505" y="92" text-anchor="middle" class="t tx">React 18 · TypeScript · Vite</text>
<text x="505" y="110" text-anchor="middle" class="t tx">Tailwind · Recharts · lucide-react</text>
